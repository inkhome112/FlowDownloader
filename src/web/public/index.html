<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowDownloader Dashboard</title>
  <!-- Cache-busted assets - bump version to force fresh load -->
  <link rel="stylesheet" href="style.css?v=1.5.1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header / Navbar -->
    <header class="navbar">
      <div class="logo">
        <span class="icon">🎬</span>
        <h1>FlowDownloader</h1>
        <span class="badge">v1.5.1</span>
      </div>
      <div class="actions">
        <button id="open-folder-btn" class="btn btn-secondary">
          <span class="btn-icon">📁</span> Open Download Folder
        </button>
        <button id="trigger-sync-btn" class="btn btn-primary">
          <span class="btn-icon">⚡</span> Trigger Sync
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Stats Cards Row -->
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Total Tracked</div>
          <div id="stat-total" class="stat-value">0</div>
        </div>
        <div class="stat-card stat-success">
          <div class="stat-title">Completed</div>
          <div id="stat-completed" class="stat-value">0</div>
        </div>
        <div class="stat-card stat-warning">
          <div class="stat-title">Pending</div>
          <div id="stat-pending" class="stat-value">0</div>
        </div>
        <div class="stat-card stat-danger">
          <div class="stat-title">Failed</div>
          <div id="stat-failed" class="stat-value">0</div>
        </div>
      </section>

      <!-- Settings Panel -->
      <section class="settings-panel">

        <!-- Date Filter Row -->
        <div class="settings-row">
          <div class="settings-row-label">📅 Download Date Filter</div>
          <div class="settings-row-controls">
            <select id="date-filter-mode">
              <option value="TODAY">Downloaded Today Only</option>
              <option value="ALL">All Time (No Filter)</option>
              <option value="SPECIFIC">Downloaded on Specific Date...</option>
            </select>
            <input type="date" id="specific-date-input" class="hidden">
            <button id="apply-date-filter-btn" class="btn btn-secondary btn-sm">Apply Filter</button>
          </div>
        </div>

        <!-- Download Directory Path Row -->
        <div class="settings-row">
          <div class="settings-row-label">📥 Save Directory</div>
          <div class="settings-row-controls" style="flex: 1;">
            <input type="text" id="download-folder-input" class="settings-path-input" placeholder="e.g. D:\Downloads\Flow">
            <input type="file" id="folder-picker-file-input" webkitdirectory style="display: none;">
            <button id="browse-folder-btn" class="btn btn-secondary btn-sm"><span class="btn-icon">📂</span> Browse...</button>
            <button id="save-folder-btn" class="btn btn-primary btn-sm">Save Directory</button>
          </div>
        </div>

        <!-- Storage Quota Row -->
        <div class="settings-row settings-row-storage">
          <div class="settings-row-label">🗂️ Storage Auto-Archive</div>
          <div class="settings-row-controls">
            <label class="toggle-switch">
              <input type="checkbox" id="enable-archiving-chk">
              <span class="toggle-slider"></span>
            </label>
            <span class="settings-sep">Max Storage:</span>
            <input type="number" id="max-storage-gb" min="1" max="2000" class="settings-number-input">
            <span class="settings-unit">GB</span>
            <span class="settings-sep">Retention:</span>
            <input type="number" id="auto-archive-days" min="1" max="365" class="settings-number-input">
            <span class="settings-unit">days</span>
            <button id="save-storage-btn" class="btn btn-secondary btn-sm">Save Quota</button>
          </div>
        </div>

      </section>

      <!-- Search & Status Toolbar -->
      <section class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search prompt, ID, or filename...">
        </div>
        <div class="filter-box">
          <select id="status-filter">
            <option value="ALL">All Statuses</option>
            <option value="COMPLETED">Completed</option>
            <option value="PENDING">Pending</option>
            <option value="FAILED">Failed</option>
          </select>
        </div>
      </section>

      <!-- Video Grid -->
      <section id="video-grid" class="video-grid">
        <!-- Dynamically injected video cards -->
      </section>
    </main>

    <!-- Video Preview Modal -->
    <div id="video-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <button id="modal-close-btn" class="modal-close">&times;</button>
        <h3 id="modal-title">Video Preview</h3>
        <video id="modal-video-player" controls autoplay></video>
        <div id="modal-meta" class="modal-meta"></div>
      </div>
    </div>
  </div>

  <script src="app.js?v=1.5.1"></script>
</body>
</html>
